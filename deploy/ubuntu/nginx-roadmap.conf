# nginx site: HTTPS in front of the app, open to everyone with no login.
# Install: cp deploy/ubuntu/nginx-roadmap.conf /etc/nginx/sites-available/roadmap
#          ln -sf /etc/nginx/sites-available/roadmap /etc/nginx/sites-enabled/roadmap
#          rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/roadmap/roadmap.crt;
    ssl_certificate_key /etc/ssl/roadmap/roadmap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The upgrade shutdown endpoint trusts loopback clients. Behind this proxy every
    # request comes from loopback, so it must never be reachable from outside.
    location /api/v1/admin/ { return 403; }

    # The server stores one progress record for everyone. Hiding it keeps each
    # visitor's progress in their own browser instead of overwriting each other's.
    location = /api/v1/state { return 404; }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
